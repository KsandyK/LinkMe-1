openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: VibeLink API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: User profiles
  - name: livefeeds
    description: Live video feeds
  - name: credits
    description: Credits and transactions
  - name: messages
    description: Messaging
  - name: gifts
    description: Gift store
  - name: boosts
    description: Profile boosts
  - name: creator
    description: Creator dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles:
    get:
      operationId: getProfiles
      tags: [profiles]
      summary: Get all profiles
      parameters:
        - name: gender
          in: query
          schema:
            type: string
        - name: ageMin
          in: query
          schema:
            type: number
        - name: ageMax
          in: query
          schema:
            type: number
        - name: location
          in: query
          schema:
            type: string
        - name: isLive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetail"
        "404":
          description: Not found
  /livefeeds:
    get:
      operationId: getLiveFeeds
      tags: [livefeeds]
      summary: Get live feeds
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Live feeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveFeed"
  /livefeeds/{id}:
    get:
      operationId: getLiveFeed
      tags: [livefeeds]
      summary: Get a specific live feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Live feed detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveFeed"
  /credits/packages:
    get:
      operationId: getCreditPackages
      tags: [credits]
      summary: Get credit packages
      responses:
        "200":
          description: Credit packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPackage"
  /credits/purchase:
    post:
      operationId: purchaseCredits
      tags: [credits]
      summary: Purchase credits (mock CCBill)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseCreditsRequest"
      responses:
        "200":
          description: Purchase result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseCreditsResponse"
  /credits/unlock:
    post:
      operationId: unlockContent
      tags: [credits]
      summary: Unlock photo or video content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockContentRequest"
      responses:
        "200":
          description: Unlock result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockContentResponse"
  /messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get message threads
      responses:
        "200":
          description: Message threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageThread"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message (costs credits)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
  /gifts:
    get:
      operationId: getGifts
      tags: [gifts]
      summary: Get gifts available
      responses:
        "200":
          description: Gifts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gift"
  /gifts/send:
    post:
      operationId: sendGift
      tags: [gifts]
      summary: Send a gift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendGiftRequest"
      responses:
        "200":
          description: Gift sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendGiftResponse"
  /boosts:
    get:
      operationId: getBoostPackages
      tags: [boosts]
      summary: Get boost packages
      responses:
        "200":
          description: Boost packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoostPackage"
  /creator/dashboard:
    get:
      operationId: getCreatorDashboard
      tags: [creator]
      summary: Get creator dashboard data
      responses:
        "200":
          description: Creator dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorDashboard"
  /user/account:
    get:
      operationId: getUserAccount
      tags: [profiles]
      summary: Get user account info
      responses:
        "200":
          description: User account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Badge:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        description:
          type: string
      required:
        - id
        - name
        - icon
        - color
        - description
    Profile:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        age:
          type: number
        location:
          type: string
        gender:
          type: string
        isLive:
          type: boolean
        isCreator:
          type: boolean
        avatarUrl:
          type: string
        coverUrl:
          type: string
        tagline:
          type: string
        viewerCount:
          type: number
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        tier:
          type: string
        rating:
          type: number
        totalEarnings:
          type: number
      required:
        - id
        - username
        - displayName
        - age
        - location
        - gender
        - isLive
        - isCreator
        - avatarUrl
        - tagline
        - badges
        - tier
    MediaItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [photo, video]
        thumbnailUrl:
          type: string
        isLocked:
          type: boolean
        creditCost:
          type: number
        title:
          type: string
      required:
        - id
        - type
        - thumbnailUrl
        - isLocked
        - creditCost
        - title
    ProfileDetail:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        age:
          type: number
        location:
          type: string
        gender:
          type: string
        bodyType:
          type: string
        ethnicity:
          type: string
        height:
          type: string
        isLive:
          type: boolean
        isCreator:
          type: boolean
        avatarUrl:
          type: string
        coverUrl:
          type: string
        tagline:
          type: string
        bio:
          type: string
        viewerCount:
          type: number
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        tier:
          type: string
        rating:
          type: number
        totalEarnings:
          type: number
        personalityTraits:
          type: array
          items:
            type: string
        lifestyle:
          type: string
        interests:
          type: array
          items:
            type: string
        hobbies:
          type: array
          items:
            type: string
        lookingFor:
          type: string
        relationshipGoals:
          type: string
        liveSchedule:
          type: string
        sexualPreferences:
          type: object
          properties:
            orientation:
              type: string
            lockedDetails:
              type: string
          required:
            - orientation
            - lockedDetails
        mediaItems:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"
        followersCount:
          type: number
        likesCount:
          type: number
        joinedDate:
          type: string
      required:
        - id
        - username
        - displayName
        - age
        - location
        - gender
        - isLive
        - isCreator
        - avatarUrl
        - tagline
        - bio
        - badges
        - tier
        - mediaItems
        - interests
        - hobbies
        - personalityTraits
        - lookingFor
        - relationshipGoals
        - liveSchedule
        - sexualPreferences
        - followersCount
        - likesCount
        - joinedDate
    LiveFeed:
      type: object
      properties:
        id:
          type: string
        hostId:
          type: string
        hostName:
          type: string
        hostAvatarUrl:
          type: string
        title:
          type: string
        thumbnailUrl:
          type: string
        viewerCount:
          type: number
        category:
          type: string
        isVip:
          type: boolean
        vipCost:
          type: number
        tags:
          type: array
          items:
            type: string
        startedAt:
          type: string
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
      required:
        - id
        - hostId
        - hostName
        - hostAvatarUrl
        - title
        - thumbnailUrl
        - viewerCount
        - category
        - isVip
        - tags
        - startedAt
        - badges
    CreditPackage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        credits:
          type: number
        bonusCredits:
          type: number
        price:
          type: number
        popular:
          type: boolean
        savings:
          type: string
        description:
          type: string
      required:
        - id
        - name
        - credits
        - bonusCredits
        - price
        - popular
    PurchaseCreditsRequest:
      type: object
      properties:
        packageId:
          type: string
        paymentMethod:
          type: string
      required:
        - packageId
        - paymentMethod
    PurchaseCreditsResponse:
      type: object
      properties:
        success:
          type: boolean
        creditsAdded:
          type: number
        newBalance:
          type: number
        transactionId:
          type: string
      required:
        - success
        - creditsAdded
        - newBalance
        - transactionId
    UnlockContentRequest:
      type: object
      properties:
        mediaItemId:
          type: string
        profileId:
          type: string
      required:
        - mediaItemId
        - profileId
    UnlockContentResponse:
      type: object
      properties:
        success:
          type: boolean
        creditsSpent:
          type: number
        newBalance:
          type: number
        mediaUrl:
          type: string
      required:
        - success
        - creditsSpent
        - newBalance
        - mediaUrl
    MessageThread:
      type: object
      properties:
        id:
          type: string
        recipientId:
          type: string
        recipientName:
          type: string
        recipientAvatarUrl:
          type: string
        lastMessage:
          type: string
        lastMessageAt:
          type: string
        unreadCount:
          type: number
        creditCostPerMessage:
          type: number
        isOnline:
          type: boolean
      required:
        - id
        - recipientId
        - recipientName
        - recipientAvatarUrl
        - lastMessage
        - lastMessageAt
        - unreadCount
        - creditCostPerMessage
        - isOnline
    SendMessageRequest:
      type: object
      properties:
        recipientId:
          type: string
        content:
          type: string
      required:
        - recipientId
        - content
    SendMessageResponse:
      type: object
      properties:
        success:
          type: boolean
        creditsSpent:
          type: number
        newBalance:
          type: number
        messageId:
          type: string
      required:
        - success
        - creditsSpent
        - newBalance
        - messageId
    Gift:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        emoji:
          type: string
        creditCost:
          type: number
        description:
          type: string
        category:
          type: string
        effect:
          type: string
      required:
        - id
        - name
        - emoji
        - creditCost
        - description
        - category
    SendGiftRequest:
      type: object
      properties:
        giftId:
          type: string
        recipientId:
          type: string
      required:
        - giftId
        - recipientId
    SendGiftResponse:
      type: object
      properties:
        success:
          type: boolean
        creditsSpent:
          type: number
        newBalance:
          type: number
        giftId:
          type: string
      required:
        - success
        - creditsSpent
        - newBalance
        - giftId
    BoostPackage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        boostsPerMonth:
          type: number
        price:
          type: number
        description:
          type: string
        features:
          type: array
          items:
            type: string
        popular:
          type: boolean
      required:
        - id
        - name
        - boostsPerMonth
        - price
        - description
        - features
        - popular
    CreatorDashboard:
      type: object
      properties:
        creatorId:
          type: string
        displayName:
          type: string
        tier:
          type: string
        monthlyEarnings:
          type: number
        totalEarnings:
          type: number
        platformCut:
          type: number
        creatorCut:
          type: number
        weeklyPayoutNext:
          type: string
        totalFollowers:
          type: number
        totalLikes:
          type: number
        contentSold:
          type: number
        giftReceived:
          type: number
        revenueBreakdown:
          type: object
          properties:
            subscriptions:
              type: number
            contentUnlocks:
              type: number
            gifts:
              type: number
            tips:
              type: number
            privateDates:
              type: number
          required:
            - subscriptions
            - contentUnlocks
            - gifts
            - tips
            - privateDates
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
      required:
        - creatorId
        - displayName
        - tier
        - monthlyEarnings
        - totalEarnings
        - platformCut
        - creatorCut
        - weeklyPayoutNext
        - totalFollowers
        - totalLikes
        - contentSold
        - giftReceived
        - revenueBreakdown
        - badges
    UserAccount:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        tier:
          type: string
        tierLabel:
          type: string
        monthlySpend:
          type: number
        nextTierSpend:
          type: number
        nextTierLabel:
          type: string
        creditBalance:
          type: number
        bonusCreditsRate:
          type: number
        discountRate:
          type: number
        boostsPerMonth:
          type: number
        boostsUsed:
          type: number
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        memberSince:
          type: string
        referralCode:
          type: string
        referralCredits:
          type: number
      required:
        - id
        - username
        - displayName
        - avatarUrl
        - tier
        - tierLabel
        - monthlySpend
        - nextTierSpend
        - nextTierLabel
        - creditBalance
        - bonusCreditsRate
        - discountRate
        - boostsPerMonth
        - boostsUsed
        - badges
        - memberSince
        - referralCode
        - referralCredits
