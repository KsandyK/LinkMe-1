################################################################################
# CRAVR — SRS (Simple Realtime Server) Configuration
#
# RTMP ingest:  port 1935  (OBS/Streamlabs → rtmp://<domain>:1935/live/<key>)
# HLS origin:   port 8080  (nginx Pull Zone → http://srs:8080/live/<key>/...)
# HTTP API:     port 1985  (internal management only)
#
# Bunny.net Pull Zone origin:  http://<server-ip>:8080
# (or proxy through nginx: https://<domain>/hls/ → http://srs:8080/)
################################################################################

listen              1935;
max_connections     2000;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

# ── Internal HTTP API (used for stats / management) ───────────────────────────
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# ── HTTP server — serves HLS segments to Bunny Pull Zone ─────────────────────
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    cross_domain    on;
}

# ── Stats (stream health, viewer counts) ─────────────────────────────────────
stats {
    network         0;
    disk            sda sdb xvda xvdb;
}

# ── Default vhost — all streams go here ──────────────────────────────────────
vhost __defaultVhost__ {

    # Webhook callbacks: SRS calls the API when a stream starts or stops.
    # The API validates the stream key and returns {"code":0} to allow.
    # Non-zero code = stream rejected.
    http_hooks {
        enabled         on;
        on_publish      http://api:3000/api/streams/webhook/srs;
        on_unpublish    http://api:3000/api/streams/webhook/srs;
        # on_play / on_stop available if you need viewer-level auth later
    }

    # ── HLS output (primary delivery path to Bunny CDN) ──────────────────────
    # Segments land at: ./objs/nginx/html/live/<stream_key>/<seg>.ts
    # Playlist:         ./objs/nginx/html/live/<stream_key>/index.m3u8
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;      # 2-second segments — good balance of latency vs rebuffering
        hls_window      10;     # keep last 10 segments = 20s rolling window
        hls_cleanup     on;     # delete old segments when stream ends
        hls_m3u8_file   [app]/[stream]/index.m3u8;
        hls_ts_file     [app]/[stream]/[seq].ts;
    }

    # ── TCP settings for low-latency ingest ──────────────────────────────────
    tcp_nodelay     on;

    # ── Bandwidth / bitrate limits per stream ─────────────────────────────────
    # Uncomment to cap OBS streams at 6 Mbps (protects server under load)
    # publish {
    #     mr          off;
    #     firstpkt_timeout 20000;
    #     normal_timeout 7000;
    # }
}
