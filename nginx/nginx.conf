################################################################################
# CRAVR — Reverse Proxy + SSL Termination
#
# Handles:
#   - HTTP → HTTPS redirect
#   - SSL via Let's Encrypt / certbot (certs live in /etc/letsencrypt)
#   - /api/* and /ws  → API container (port 3000 / 3001)
#   - Everything else → Web container (port 80)
#
# Replace every occurrence of YOURDOMAIN.COM with your actual domain.
################################################################################

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Security headers applied globally
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upstream services ───────────────────────────────────────────────────────
    upstream api {
        server api:3000;
    }

    upstream web {
        server web:80;
    }

    upstream srs_hls {
        server srs:8080;
    }

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────────────
    server {
        listen 80;
        server_name YOURDOMAIN.COM www.YOURDOMAIN.COM;

        # Let certbot renew via HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name YOURDOMAIN.COM www.YOURDOMAIN.COM;

        # SSL certificates (managed by certbot)
        ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN.COM/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN.COM/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/YOURDOMAIN.COM/chain.pem;

        # Modern TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS (enable after you're sure SSL works)
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        client_max_body_size 50M;

        # ── WebSocket upgrade (live streams, chat) ─────────────────────────────
        location /ws {
            proxy_pass http://api:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── HLS origin proxy → SRS (Bunny Pull Zone pulls from here) ─────────
        # Bunny.net Pull Zone: set Origin URL = https://YOURDOMAIN.COM/hls/
        # Viewer HLS URL:      https://<bunny-cdn>/live/<stream_key>/index.m3u8
        location /hls/ {
            proxy_pass         http://srs_hls/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;

            # CORS — Bunny's edge nodes need this to pull segments
            add_header Access-Control-Allow-Origin  * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

            # Cache HLS segments at the edge (short TTL — live content)
            add_header Cache-Control "public, max-age=2";
            # m3u8 playlists must not be cached (they update every few seconds)
            location ~* \.m3u8$ {
                proxy_pass http://srs_hls;
                add_header Cache-Control "no-cache, no-store";
                add_header Access-Control-Allow-Origin * always;
            }
        }

        # ── REST API ───────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── SPA (everything else) ──────────────────────────────────────────────
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
