################################################################################
# CRAVR — Production Docker Compose
#
# Usage:
#   cp .env.production .env
#   docker compose -f docker-compose.prod.yml up -d
#
# Services:
#   postgres   — PostgreSQL 16 database
#   api        — Express API (port 3000) + WebSocket (port 3001)
#   web        — Vite SPA served by nginx (internal port 80)
#   proxy      — Public-facing nginx: HTTPS termination + routing
################################################################################

services:

  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CRAVR}
      POSTGRES_USER: ${POSTGRES_USER:-CRAVR}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-CRAVR} -d ${POSTGRES_DB:-CRAVR}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API ───────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-CRAVR}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-CRAVR}?sslmode=disable
      DIRECT_URL: postgresql://${POSTGRES_USER:-CRAVR}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-CRAVR}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    # Expose WS port internally only; proxy handles external routing
    expose:
      - "3000"
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Web (SPA) ─────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "80"

  # ── Reverse Proxy ─────────────────────────────────────────────────────────────
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - api
      - web
    networks:
      - internal

  # ── SRS — RTMP ingest + HLS origin ───────────────────────────────────────────
  # RTMP port 1935 is published publicly so OBS/Streamlabs can reach it.
  # HTTP port 8080 is internal only — nginx proxies /hls/ to it.
  # Bunny.net Pull Zone origin: https://<domain>/hls/
  srs:
    image: ossrs/srs:5
    restart: unless-stopped
    command: objs/srs -c /etc/srs/srs.conf
    volumes:
      - ./srs/srs.conf:/etc/srs/srs.conf:ro
      - srs_data:/usr/local/srs/objs/nginx/html
    ports:
      - "1935:1935"       # RTMP ingest — public (OBS connects here)
    expose:
      - "8080"            # HLS origin — internal only (nginx proxies to Bunny)
      - "1985"            # HTTP API — internal only
    networks:
      - internal
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1985/api/v1/versions || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Certbot (SSL renewal) ─────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Run manually to obtain/renew certs — see DEPLOY.md
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  certbot_webroot:
  srs_data:
